name: Download File and Upload Artifact

on:
  workflow_dispatch:
    inputs:
      url:
        description: '文件下载链接'
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Create download directory
        run: mkdir -p download

      - name: Download file
        id: download
        working-directory: download
        run: |
          # 使用 wget 跟随重定向并解析 Content-Disposition 文件名
          wget --content-disposition "${{ inputs.url }}"
          # 输出下载的文件名，方便调试
          echo "Downloaded file: $(ls -1)"
          echo "filename=$(ls -1)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: download/${{ steps.download.outputs.filename }}
          archive: false